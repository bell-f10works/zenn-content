name: Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build semgrep image
        run: docker build -t local-semgrep docker/semgrep/
      - name: Run semgrep
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            local-semgrep \
            semgrep scan --config p/default --metrics=off --error --quiet .

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build gitleaks image
        run: docker build -t local-gitleaks docker/gitleaks/
      - name: Run gitleaks
        run: |
          # コンテナ内の root と runner のユーザーが異なるため、
          # safe.directory を渡さないと git が dubious ownership エラーになる
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            local-gitleaks \
            detect --source . --no-banner --redact
